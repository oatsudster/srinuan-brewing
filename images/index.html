<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ศรีนวล — Srinuan Brewing</title>
<meta name="description" content="ตามศรีนวล บริววิ่งและสั่งซื้อได้ที่นี่">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Zilla+Slab:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#182238;--navy-deep:#0f1626;--cream:#F1E6CE;--cream-dim:#d9caa8;--amber:#D98A2B;--coral:#C1442C;--teal:#4C776E;--line:rgba(241,230,206,0.18);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--navy-deep);color:var(--cream);font-family:'Zilla Slab',serif;min-height:100%;}
body{background-image:radial-gradient(ellipse at 50% -10%,rgba(76,119,110,0.25),transparent 60%),repeating-linear-gradient(0deg,rgba(241,230,206,0.025) 0px,rgba(241,230,206,0.025) 1px,transparent 1px,transparent 3px),linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);background-attachment:fixed;display:flex;justify-content:center;padding:0 0 64px;}
.wrap{width:100%;max-width:440px;padding:56px 28px 0;position:relative;z-index:1;}
.crest{display:flex;justify-content:center;margin-bottom:18px;}
.crest svg{width:128px;height:128px;}
.eyebrow{text-align:center;font-family:'Space Mono',monospace;letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--teal);margin:0 0 6px;}
h1.wordmark{font-family:'Pirata One',serif;font-size:clamp(44px,13vw,60px);line-height:.95;text-align:center;letter-spacing:.02em;margin:0;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.4);}
.subtitle{text-align:center;font-size:14px;color:var(--cream-dim);letter-spacing:.04em;margin:8px 0 0;font-style:italic;}
.rule{display:flex;align-items:center;gap:10px;margin:28px 0 22px;color:var(--teal);}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);}
.rule span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--cream-dim);}
.order-card{position:relative;display:flex;align-items:center;gap:16px;padding:20px 22px;text-decoration:none;color:var(--navy-deep);background:linear-gradient(135deg,var(--amber),#f0b45a);border-radius:3px;margin-bottom:22px;box-shadow:0 6px 20px rgba(217,138,43,.35);}
.order-icon{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;}
.order-icon svg{width:26px;height:26px;}
.order-text{flex:1;}
.order-title{font-weight:700;font-size:19px;margin:0;letter-spacing:.01em;}
.order-sub{font-family:'Space Mono',monospace;font-size:11px;margin:3px 0 0;opacity:.75;letter-spacing:.03em;}
.links{display:flex;flex-direction:column;gap:16px;}
.link-card{position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;text-decoration:none;color:var(--cream);border:1px solid var(--line);background:linear-gradient(180deg,rgba(241,230,206,.05),rgba(241,230,206,.02));border-radius:2px;}
.link-card::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:3px;background:var(--accent,var(--amber));}
.icon{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--accent,var(--amber));}
.icon svg{width:22px;height:22px;}
.link-text{flex:1;min-width:0;}
.link-title{font-weight:700;font-size:17px;letter-spacing:.01em;margin:0;}
.link-handle{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--cream-dim);margin:2px 0 0;letter-spacing:.02em;}
.chevron{flex:none;color:var(--cream-dim);}
.tiktok{--accent:var(--coral);}
.instagram{--accent:var(--amber);}
.facebook{--accent:var(--teal);}
footer{text-align:center;margin-top:40px;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--cream-dim);opacity:.6;}
footer p{margin:4px 0;}
</style>
</head>
