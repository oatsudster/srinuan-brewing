<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Srinuan Brewing</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=25">
<style>
  body { min-height: 100vh; }
  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 60px 24px 100px; }
  .admin-login {
    max-width: 360px; margin: 15vh auto 0; text-align: center;
    background: var(--navy-900); border: 1px solid rgba(217,164,91,0.25);
    border-radius: var(--radius); padding: 36px 30px;
  }
  .admin-login input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(245,236,217,0.2);
    background: var(--navy-800); color: var(--cream-100); font-family: var(--font-body); font-size: 15px;
    margin: 16px 0; box-sizing: border-box;
  }
  .admin-login__error { color: var(--danger); font-size: 13px; min-height: 18px; }
  .admin-title { font-family: var(--font-display); font-size: 26px; margin-bottom: 24px; text-align: center; }
  .admin-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .admin-tab {
    padding: 9px 22px; border-radius: 999px; border: 1px solid rgba(217,164,91,0.3);
    background: transparent; color: var(--cream-200); font-family: var(--font-body); font-size: 14px; cursor: pointer;
  }
  .admin-tab.active { background: var(--gold-400); color: var(--navy-950); font-weight: 600; border-color: var(--gold-400); }
  .stock-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--navy-800); border: 1px solid rgba(217,164,91,0.12); border-radius: 12px; margin-bottom: 12px;
  }
  .stock-row img { width: 46px; height: 46px; object-fit: contain; }
  .stock-row__name { flex: 1; font-weight: 500; }
  .stock-row input[type="number"] {
    width: 84px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(245,236,217,0.2);
    background: var(--navy-900); color: var(--cream-100); font-size: 15px; text-align: center;
  }
  .stock-row__status { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  .stock-row__status.ok { background: rgba(63,122,118,0.18); color: var(--teal-400); }
  .stock-row__status.saving { background: rgba(217,164,91,0.15); color: var(--gold-400); }
  .admin-logout { text-align: center; margin-top: 30px; }
  .admin-logout a { color: var(--ink-muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

  .order-card {
    background: var(--navy-800); border: 1px solid rgba(217,164,91,0.12); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .order-card__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .order-card__id { font-family: var(--font-display); font-size: 15px; color: var(--gold-400); }
  .order-card__status { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
  .order-card__status.pending { background: rgba(217,164,91,0.15); color: var(--gold-400); }
  .order-card__status.shipped { background: rgba(63,122,118,0.18); color: var(--teal-400); }
  .order-card__items { font-size: 13px; color: var(--cream-200); margin: 0 0 8px; }
  .order-card__meta { font-size: 12.5px; color: var(--ink-muted); margin: 0 0 4px; }
  .order-card__ship { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .order-card__ship input {
    flex: 1; min-width: 120px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(245,236,217,0.2);
    background: var(--navy-900); color: var(--cream-100); font-size: 13.5px;
  }
  .order-card__ship button {
    padding: 8px 16px; border-radius: 8px; border: none; background: var(--gold-400); color: var(--navy-950);
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .order-card__carrier-lock {
    display: flex; align-items: center; padding: 8px 10px; border-radius: 8px;
    background: var(--navy-900); border: 1px solid rgba(245,236,217,0.12);
    color: var(--ink-muted); font-size: 13px; white-space: nowrap;
  }
  .order-card__shipped-info { font-size: 12.5px; color: var(--teal-400); margin-top: 8px; }
  .admin-empty { text-align: center; color: var(--ink-muted); padding: 30px 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 26px; }
  .stat-card {
    background: var(--navy-800); border: 1px solid rgba(217,164,91,0.12); border-radius: 12px;
    padding: 18px 16px;
  }
  .stat-card__label { font-size: 12px; color: var(--ink-muted); margin-bottom: 6px; }
  .stat-card__value { font-family: var(--font-display); font-size: 24px; color: var(--gold-400); }
  .stat-card__sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 4px; }
  .dash-section-title { font-size: 14px; font-weight: 600; color: var(--cream-200); margin: 22px 0 10px; }
  .low-stock-row {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    background: var(--navy-800); border: 1px solid rgba(192,85,63,0.25); border-radius: 10px; margin-bottom: 8px;
  }
  .low-stock-row span:last-child { font-weight: 700; color: var(--danger); }
  .bestseller-row {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    background: var(--navy-800); border: 1px solid rgba(217,164,91,0.12); border-radius: 10px; margin-bottom: 8px;
  }
  .bestseller-row span:last-child { font-weight: 700; color: var(--gold-400); }
</style>
</head>
<body>

<div id="login-view" class="admin-wrap">
  <div class="admin-login">
    <h1 class="admin-title">Admin Login</h1>
    <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn--primary" id="login-btn" style="width:100%">Login</button>
    <p class="admin-login__error" id="login-error"></p>
  </div>
</div>

<div id="main-view" class="admin-wrap hidden">
  <div class="admin-tabs">
    <button class="admin-tab active" id="tab-dashboard">Dashboard</button>
    <button class="admin-tab" id="tab-stock">Stock</button>
    <button class="admin-tab" id="tab-orders">Orders</button>
  </div>

  <div id="dashboard-view">
    <h1 class="admin-title">Dashboard</h1>
    <div id="dashboard-content">Loading...</div>
  </div>

  <div id="stock-view" class="hidden">
    <h1 class="admin-title">Stock Management</h1>
    <div id="stock-list"></div>
  </div>

  <div id="orders-view" class="hidden">
    <h1 class="admin-title">Orders</h1>
    <div id="orders-list"></div>
  </div>

  <div class="admin-logout"><a id="logout-link">Log out</a></div>
</div>

<script src="js/products.js?v=25"></script>
<script>
(function () {
  "use strict";
  var PW_KEY = "srinuan_admin_pw";

  // Order fields (name, address, email, product names) are customer-supplied and
  // are rendered into innerHTML - escape them or a hostile order becomes script
  // running in the admin session, which holds the admin password.
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  var loginView = document.getElementById("login-view");
  var mainView = document.getElementById("main-view");
  var loginBtn = document.getElementById("login-btn");
  var pwInput = document.getElementById("admin-password");
  var loginError = document.getElementById("login-error");
  var stockList = document.getElementById("stock-list");
  var ordersList = document.getElementById("orders-list");
  var dashboardContent = document.getElementById("dashboard-content");
  var dashboardView = document.getElementById("dashboard-view");
  var stockView = document.getElementById("stock-view");
  var ordersView = document.getElementById("orders-view");
  var tabDashboard = document.getElementById("tab-dashboard");
  var tabStock = document.getElementById("tab-stock");
  var tabOrders = document.getElementById("tab-orders");
  var LOW_STOCK_THRESHOLD = 5;

  function showMainView() {
    loginView.classList.add("hidden");
    mainView.classList.remove("hidden");
    loadDashboard();
  }

  function setActiveTab(tab) {
    [tabDashboard, tabStock, tabOrders].forEach(function (t) { t.classList.remove("active"); });
    [dashboardView, stockView, ordersView].forEach(function (v) { v.classList.add("hidden"); });
    tab.el.classList.add("active");
    tab.view.classList.remove("hidden");
  }

  tabDashboard.addEventListener("click", function () {
    setActiveTab({ el: tabDashboard, view: dashboardView });
    loadDashboard();
  });
  tabStock.addEventListener("click", function () {
    setActiveTab({ el: tabStock, view: stockView });
    loadStock();
  });
  tabOrders.addEventListener("click", function () {
    setActiveTab({ el: tabOrders, view: ordersView });
    loadOrders();
  });

  async function tryLogin(password) {
    loginError.textContent = "";
    loginBtn.disabled = true;
    try {
      var res = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: password })
      });
      var data = await res.json();
      if (data.ok) {
        sessionStorage.setItem(PW_KEY, password);
        showMainView();
      } else {
        loginError.textContent = "Wrong password";
      }
    } catch (e) {
      loginError.textContent = "Connection error";
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener("click", function () { tryLogin(pwInput.value); });
  pwInput.addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(pwInput.value); });

  document.getElementById("logout-link").addEventListener("click", function () {
    sessionStorage.removeItem(PW_KEY);
    location.reload();
  });

  async function loadStock() {
    stockList.innerHTML = "Loading...";
    var res = await fetch("/api/stock?t=" + Date.now(), { cache: "no-store" });
    var stock = await res.json();
    stockList.innerHTML = "";
    PRODUCTS.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "stock-row";
      row.innerHTML =
        '<img src="' + p.image + '" alt="">' +
        '<div class="stock-row__name">' + p.name.en + "</div>" +
        '<input type="number" min="0" value="' + (stock[p.id] != null ? stock[p.id] : 0) + '" data-id="' + p.id + '">' +
        '<span class="stock-row__status"></span>';
      stockList.appendChild(row);

      var input = row.querySelector("input");
      var statusEl = row.querySelector(".stock-row__status");
      var timer = null;
      input.addEventListener("input", function () {
        clearTimeout(timer);
        statusEl.textContent = "";
        statusEl.className = "stock-row__status";
        timer = setTimeout(function () { saveStock(p.id, input.value, statusEl); }, 600);
      });
    });
  }

  async function saveStock(productId, value, statusEl) {
    statusEl.textContent = "Saving...";
    statusEl.className = "stock-row__status saving";
    var password = sessionStorage.getItem(PW_KEY);
    try {
      var res = await fetch("/api/admin-stock", {
        method: "POST",
        headers: { "content-type": "application/json", "x-admin-password": password },
        body: JSON.stringify({ productId: productId, stock: value })
      });
      if (res.ok) {
        statusEl.textContent = "Saved";
        statusEl.className = "stock-row__status ok";
      } else if (res.status === 401) {
        alert("Session expired, please log in again.");
        location.reload();
      } else {
        statusEl.textContent = "Error";
      }
    } catch (e) {
      statusEl.textContent = "Error";
    }
  }

  async function loadDashboard() {
    dashboardContent.innerHTML = "Loading...";
    var password = sessionStorage.getItem(PW_KEY);
    var ordersRes = await fetch("/api/admin-orders?t=" + Date.now(), {
      headers: { "x-admin-password": password },
      cache: "no-store"
    });
    var stockRes = await fetch("/api/stock?t=" + Date.now(), { cache: "no-store" });
    if (!ordersRes.ok || !stockRes.ok) { dashboardContent.innerHTML = "Error loading dashboard."; return; }
    var orders = await ordersRes.json();
    var stock = await stockRes.json();

    var totalOrders = orders.length;
    var totalRevenue = orders.reduce(function (sum, o) { return sum + (o.total || 0); }, 0);
    var pendingCount = orders.filter(function (o) { return o.status !== "shipped"; }).length;
    var shippedCount = totalOrders - pendingCount;

    var qtyByProduct = {};
    orders.forEach(function (o) {
      (o.items || []).forEach(function (i) {
        qtyByProduct[i.productName] = (qtyByProduct[i.productName] || 0) + i.quantity;
      });
    });
    var bestSellers = Object.keys(qtyByProduct)
      .map(function (name) { return { name: name, qty: qtyByProduct[name] }; })
      .sort(function (a, b) { return b.qty - a.qty; })
      .slice(0, 5);

    var lowStock = (typeof PRODUCTS !== "undefined" ? PRODUCTS : [])
      .map(function (p) { return { name: p.name.en, qty: stock[p.id] != null ? stock[p.id] : 0 }; })
      .filter(function (p) { return p.qty <= LOW_STOCK_THRESHOLD; })
      .sort(function (a, b) { return a.qty - b.qty; });

    var html =
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="stat-card__label">Total Orders</div><div class="stat-card__value">' + totalOrders + "</div></div>" +
        '<div class="stat-card"><div class="stat-card__label">Total Revenue</div><div class="stat-card__value">' + totalRevenue.toLocaleString() + " THB</div></div>" +
        '<div class="stat-card"><div class="stat-card__label">Pending</div><div class="stat-card__value">' + pendingCount + '</div><div class="stat-card__sub">awaiting shipment</div></div>' +
        '<div class="stat-card"><div class="stat-card__label">Shipped</div><div class="stat-card__value">' + shippedCount + "</div></div>" +
      "</div>";

    html += '<div class="dash-section-title">Best Sellers</div>';
    html += bestSellers.length
      ? bestSellers.map(function (b) {
          return '<div class="bestseller-row"><span>' + esc(b.name) + "</span><span>" + esc(b.qty) + " sold</span></div>";
        }).join("")
      : '<p class="admin-empty">No sales yet.</p>';

    html += '<div class="dash-section-title">Low Stock (≤ ' + LOW_STOCK_THRESHOLD + ")</div>";
    html += lowStock.length
      ? lowStock.map(function (p) {
          return '<div class="low-stock-row"><span>' + p.name + "</span><span>" + p.qty + " left</span></div>";
        }).join("")
      : '<p class="admin-empty">All products well stocked.</p>';

    dashboardContent.innerHTML = html;
  }

  async function loadOrders() {
    ordersList.innerHTML = "Loading...";
    var password = sessionStorage.getItem(PW_KEY);
    var res = await fetch("/api/admin-orders?t=" + Date.now(), {
      headers: { "x-admin-password": password },
      cache: "no-store"
    });
    if (!res.ok) { ordersList.innerHTML = "Error loading orders."; return; }
    var orders = await res.json();
    if (!orders.length) { ordersList.innerHTML = '<p class="admin-empty">No orders yet.</p>'; return; }
    ordersList.innerHTML = "";
    orders.forEach(function (o) { ordersList.appendChild(orderCard(o)); });
  }

  function orderCard(o) {
    var card = document.createElement("div");
    card.className = "order-card";
    var itemsText = o.items.map(function (i) { return esc(i.productName) + " x" + esc(i.quantity); }).join(", ");
    var date = new Date(o.createdAt).toLocaleString();
    card.innerHTML =
      '<div class="order-card__head">' +
        '<span class="order-card__id">#' + esc(o.id) + "</span>" +
        '<span class="order-card__status ' + esc(o.status) + '">' + esc(o.status) + "</span>" +
      "</div>" +
      '<p class="order-card__items">' + itemsText + "</p>" +
      '<p class="order-card__meta">' + esc(o.name) + " · " + esc(o.phone) + (o.email ? " · " + esc(o.email) : "") + "</p>" +
      '<p class="order-card__meta">' + (o.deliveryMethod === "pickup" ? "🚶 Self Pickup" : esc(o.address)) + "</p>" +
      '<p class="order-card__meta">Total: ' + esc(o.total) + " THB · " + date + "</p>";

    var isPickup = o.deliveryMethod === "pickup";
    if (o.status === "shipped") {
      var info = document.createElement("p");
      info.className = "order-card__shipped-info";
      info.textContent = isPickup ? "Picked up" : "Shipped: " + (o.carrier ? o.carrier + " - " : "") + o.trackingNumber;
      card.appendChild(info);
    } else if (isPickup) {
      var pickupRow = document.createElement("div");
      pickupRow.className = "order-card__ship";
      pickupRow.innerHTML = '<button type="button">Mark as Picked Up</button>';
      pickupRow.querySelector("button").addEventListener("click", function () {
        markShipped(o.id, "", "", card, false);
      });
      card.appendChild(pickupRow);
    } else {
      var shipRow = document.createElement("div");
      shipRow.className = "order-card__ship";
      shipRow.innerHTML =
        '<span class="order-card__carrier-lock">Carrier: Thailand Post</span>' +
        '<input type="text" placeholder="Tracking number" class="tracking-input">' +
        '<button type="button">Mark Shipped</button>';
      shipRow.querySelector("button").addEventListener("click", function () {
        markShipped(o.id, "Thailand Post", shipRow.querySelector(".tracking-input").value, card);
      });
      card.appendChild(shipRow);
    }
    return card;
  }

  async function markShipped(orderId, carrier, trackingNumber, card, requireTracking) {
    if (requireTracking !== false && !trackingNumber.trim()) { alert("Enter a tracking number first."); return; }
    var password = sessionStorage.getItem(PW_KEY);
    try {
      var res = await fetch("/api/admin-ship", {
        method: "POST",
        headers: { "content-type": "application/json", "x-admin-password": password },
        body: JSON.stringify({ orderId: orderId, carrier: carrier, trackingNumber: trackingNumber })
      });
      var data = await res.json();
      if (res.ok && data.ok) {
        loadOrders();
      } else {
        alert("Failed to update order.");
      }
    } catch (e) {
      alert("Connection error.");
    }
  }

  var savedPw = sessionStorage.getItem(PW_KEY);
  if (savedPw) { tryLogin(savedPw); }
})();
</script>
</body>
</html>
